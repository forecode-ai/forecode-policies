apiVersion: forecode/v1
kind: Guardrail
id: gha-no-secret-echo
title: Secrets aren't echoed in run steps
message: Pass the secret to the tool through an environment variable instead of printing it.
scope: {platforms: [github-actions]}
decision:
  rationale: >-
    GitHub masks secret values in logs, but only exact matches: a secret that is encoded, split or structured (JSON,
    multi-line keys) is printed in clear. Echoing a secret expression is never needed to use it.
  decided: {date: 2026-10-08, by: ForeCode default pack}
enforcement: {default: expected}
rule:
  template: forbid_command
  params:
    patterns: ['\b(echo|printf)\b.*\$\{\{\s*secrets\.']
