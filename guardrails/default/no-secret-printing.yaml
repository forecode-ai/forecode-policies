apiVersion: forecode/v1
kind: Guardrail
id: no-secret-printing
title: Steps don't print secrets
message: Don't print the whole environment, and don't trace commands in steps that use secrets.
decision:
  rationale: >-
    Build logs are widely readable and kept for months. Printing every environment variable, or tracing commands
    (set -x) in a step that has secrets, writes secret values into those logs; log masking is best effort and misses
    transformed values.
  decided: {date: 2026-10-08, by: ForeCode default pack}
enforcement: {default: required}
rule:
  rego: |
    dumps_environment(line) if regex.match(`^\s*(sudo\s+)?(printenv|env|set|export\s+-p)\s*($|[|>;&#])`, line)

    traces(line) if regex.match(`^\s*set\s+(-[A-Za-z]*x|-o\s+xtrace)`, line)

    traces(line) if regex.match(`^\s*(ba|z)?sh\s+-[A-Za-z]*x`, line)

    violations contains v if {
    	some job in input.pipeline.jobs
    	some step in job.steps
    	is_string(step.command)
    	some line in split(step.command, "\n")
    	dumps_environment(line)
    	v := {"job": job.id, "step": step.id, "detail": "prints every environment variable, including secrets"}
    }

    violations contains v if {
    	some job in input.pipeline.jobs
    	some step in job.steps
    	count(step.secrets_used) > 0
    	is_string(step.command)
    	some line in split(step.command, "\n")
    	traces(line)
    	v := {"job": job.id, "step": step.id, "detail": "traces commands in a step that uses secrets, which prints their values"}
    }
